<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participe | ODS 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <h1 class="logo">Projeto Educa+</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="acoes.html">Ações</a></li>
                    <li><a href="contato.html" class="active">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container content-page">
        <h2>Faça Parte da Mudança</h2>
        <p>Quer ser voluntário ministrando oficinas, apoiar na organização ou cadastrar sua escola parceira? Fale conosco.</p>
        
        <form class="form-contato">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>
            
            <div class="form-group">
                <label for="interesse">Área de Interesse</label>
                <select id="interesse" name="interesse">
                    <option value="voluntariado">Voluntariado em Aulas</option>
                    <option value="doacao">Doação de Equipamentos/Livros</option>
                    <option value="parceria">Parceria Institucional / Escolas</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Como você gostaria de colaborar?" required></textarea>
            </div>

            <button type="submit" class="btn">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Projeto Educa+ - Prática Extensionista Universitária</p>
        </div>
    </footer>
</body>
</html>
